<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>strwTranslate</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header>
  <div class="brand">
    <span class="hat" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6.5 13V9.5a5.5 5.5 0 0 1 11 0V13"/>
        <ellipse cx="12" cy="13.6" rx="9.5" ry="2.9"/>
        <path d="M6.6 11.2h10.8"/>
      </svg>
    </span>
    <span class="name">strw<b>Translate</b></span>
  </div>
  <div class="status-dots">
    <span class="dot" id="dot-page" title="page status"></span>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="translate">translate</button>
  <button class="tab" data-tab="sites">sites</button>
  <button class="tab" data-tab="settings">settings</button>
</nav>

<section class="panel active" data-panel="translate">
  <div class="current">
    <div class="label">this page</div>
    <div class="url" id="origin">loading…</div>
    <div class="route muted" id="page-state">original text</div>
  </div>

  <input type="text" id="lang-filter" placeholder="filter languages" autocomplete="off">
  <select id="lang" size="1" aria-label="target language"></select>

  <div class="row">
    <button class="primary" id="go">translate</button>
    <button class="ghost" id="restore">show original</button>
  </div>

  <div id="progress-wrap" style="display:none; margin-top:12px">
    <div class="bar"><span id="bar"></span></div>
    <div class="bar-meta"><span id="bar-label">working…</span><span id="bar-count"></span></div>
  </div>

  <div class="msg" id="msg"></div>
</section>

<section class="panel" data-panel="sites">
  <label class="check" style="margin-bottom:12px">
    <input type="checkbox" id="auto-site">
    <span id="auto-label">translate this site automatically</span>
  </label>

  <div class="list-head">
    <span id="rules-count">automatic sites</span>
    <button class="link" id="clear-rules">clear all</button>
  </div>
  <ul class="list" id="rule-list"></ul>
</section>

<section class="panel" data-panel="settings">
  <div class="setting-row">
    <label>pieces per request
      <select id="set-batch">
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="50">50</option>
      </select>
    </label>
    <label>requests at once
      <select id="set-concurrency">
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6">6</option>
      </select>
    </label>
  </div>
  <p class="hint" style="margin-bottom:12px">
    lower both if you hit rate limits on big pages.
  </p>

  <label class="check" style="margin-bottom:10px">
    <input type="checkbox" id="set-attributes">
    <span>translate tooltips, alt text and placeholders (may break stuff)</span>
  </label>
  <label class="check" style="margin-bottom:10px">
    <input type="checkbox" id="set-title">
    <span>translate the tab title</span>
  </label>
  <label class="check" style="margin-bottom:10px">
    <input type="checkbox" id="set-skip">
    <span>skip pages already in the target language</span>
  </label>

  <div class="sep">cache</div>
  <button class="ghost wide" id="clear-cache">clear translation cache</button>
  <p class="hint" style="margin-top:8px">
    repeated phrases are kept in memory so the same string is never fetched
    twice. clearing only frees memory as nothing is stored on your disk.
  </p>
</section>

<script src="popup.js"></script>
</body>
</html>
