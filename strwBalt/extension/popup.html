<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="hat" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 13V9.5a5.5 5.5 0 0 1 11 0V13"/>
          <ellipse cx="12" cy="13.6" rx="9.5" ry="2.9"/>
          <path d="M6.6 11.2h10.8"/>
        </svg>
      </span>
    <span class="name">strw<b>Balt</b></span>
  </div>
    <div class="status-dots">
      <span class="dot" id="dot-cobalt" title="cobalt"></span>
      <span class="dot" id="dot-ytdlp" title="yt-dlp"></span>
      <span class="dot" id="dot-spotdl" title="spotdl"></span>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="download">download</button>
    <button class="tab" data-tab="history">history</button>
    <button class="tab" data-tab="logs">logs</button>
    <button class="tab" data-tab="settings">settings</button>
  </nav>

  <section class="panel active" id="panel-download">
    <div class="current" id="current">
      <div class="label">current tab</div>
      <div class="url" id="current-url">—</div>
      <div class="route" id="current-route"></div>
    </div>

    <div class="row">
      <button class="primary" id="dl-video">download video</button>
      <button class="ghost" id="dl-audio">audio</button>
    </div>

    <div class="sep"><span>or paste a link</span></div>

    <input type="text" id="manual-url" placeholder="https://...">
    <button class="primary wide" id="dl-manual">download</button>

    <div class="msg" id="msg"></div>

    <div id="jobs"></div>
  </section>

  <section class="panel" id="panel-history">
    <div class="hist-head">
      <span id="hist-count">no downloads yet</span>
      <button class="link" id="clear-history">clear</button>
    </div>
    <ul id="hist-list"></ul>
  </section>

  <section class="panel" id="panel-logs">
    <div class="hist-head">
      <span id="log-count">nothing logged yet</span>
      <button class="link" id="clear-log">clear</button>
    </div>
    <ul id="log-list"></ul>
  </section>

  <section class="panel" id="panel-settings">
    <label>quality
      <select id="videoQuality">
        <option value="max">max</option>
        <option value="2160">2160p</option>
        <option value="1440">1440p</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </label>

    <label>codec
      <select id="videoCodec">
        <option value="h264">h264</option>
        <option value="av1">av1</option>
        <option value="vp9">vp9</option>
        <option value="any">any</option>
      </select>
      <span class="hint" id="codec-hint"></span>
    </label>

    <label>mp3 / audio
      <select id="audioFormat">
        <option value="mp3">mp3</option>
        <option value="m4a">m4a (aac)</option>
        <option value="opus">opus</option>
        <option value="wav">wav</option>
      </select>
      <select id="audioBitrate">
        <option value="best">source quality</option>
        <option value="320">320 kbps</option>
        <option value="256">256 kbps</option>
        <option value="192">192 kbps</option>
        <option value="128">128 kbps</option>
      </select>
    </label>

    <label class="check">
      <input type="checkbox" id="showPlayerButton">
      <span>show download button in the youtube player</span>
    </label>

    <label>sites via yt-dlp
      <textarea id="ytdlpHosts" rows="3"></textarea>
      <span class="hint">one host per line; everything else goes to cobalt.</span>
    </label>

    <details>
      <summary>backends</summary>
      <label>cobalt
        <input type="text" id="apiUrl" placeholder="http://localhost:9000/">
      </label>
      <label>yt-dlp
        <input type="text" id="ytdlpUrl" placeholder="http://localhost:9100/">
      </label>
      <label>spotdl
        <input type="text" id="spotdlUrl" placeholder="http://localhost:9200/">
      </label>
      <span class="hint">changing host or port also needs host_permissions
        updated in manifest.json.</span>
    </details>

    <button class="primary wide" id="save">save</button>
    <div class="msg" id="save-msg"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
